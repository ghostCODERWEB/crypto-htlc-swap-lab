[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-htlc-swap-lab"
version = "0.1.0"
description = "Replay hash-locked escrow swaps with strict expiry rules, refunds and cross-leg safety analysis."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-htlc-swap-lab = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
